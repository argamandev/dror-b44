<!doctype html>
<html dir="rtl" lang="he">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png?v=2" />
    <!-- Native-app viewport (Task N1, Sagi's explicit product decision): no
         pinch/double-tap zoom — the app should read as installed, not as a
         web page. maximum-scale=1 + user-scalable=no lock zoom off. -->
    <!-- interactive-widget=resizes-content: on browsers that support it
         (modern Chrome/Android), the on-screen keyboard resizes the layout
         viewport itself. iOS Safari ignores this token (harmless there) —
         useKeyboardInset.ts covers the visualViewport-only-resize case. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#6B71F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- What iOS writes UNDER the icon on the home screen. Latin "Dror", not
         "דרור", by Sagi's decision: the label is chrome the phone owns, not
         app content, and it sits in a row of Latin labels. Android reads the
         manifest's short_name instead — kept identical there.
         iOS only reads this (and apple-touch-icon) when the shortcut is
         ADDED. An already-installed shortcut keeps its old name and icon
         forever: it has to be deleted from the home screen and re-added. -->
    <meta name="apple-mobile-web-app-title" content="Dror" />
    <!-- ?v=2 busts the icon iOS/Safari cached from the previous set. -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;600&family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>דרור</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
